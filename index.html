<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiki Soza</title>
  <meta name="description" content="Wiki du projet Soza : un assistant personnel piloté par Telegram, doublé d'une application de bureau Windows.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232757D0'/%3E%3Cpath fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' d='M8 16c0-3.6 2.6-5.6 4.6-5.6 4 0 4.8 11.2 8.8 11.2 2 0 3.6-2 3.6-5.6s-1.6-5.6-3.6-5.6c-4 0-4.8 11.2-8.8 11.2C10.6 21.6 8 19.6 8 16z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button class="menu" id="menu" type="button" aria-label="Ouvrir le sommaire" aria-controls="side">☰</button>
      <a class="brand" href="#accueil" data-id="accueil">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">Soza</span>
      </a>
      <span class="sub">Wiki du projet</span>
      <span class="badge" id="badge">V1 terminée · 09/10/2026</span>
    </header>

    <aside class="side" id="side" aria-label="Sommaire">
      <div class="search">
        <input id="q" type="search" placeholder="Rechercher (QStash, tests…)" autocomplete="off" spellcheck="false" aria-label="Rechercher dans le wiki">
        <kbd>/</kbd>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="hints"><kbd>/</kbd> rechercher · <kbd>Ctrl</kbd>+clic : ouvrir en onglet · <kbd>Suppr</kbd> : fermer l'onglet</div>
    </aside>

    <main class="main">
      <div class="tabs" id="tabs" role="tablist" aria-label="Pages ouvertes"></div>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <script src="assets/marked.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
